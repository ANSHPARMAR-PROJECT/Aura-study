services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      COOKIE_SECURE: "true"
      AUTO_CREATE_DB: "false"
      PORT: "5000"
      DATABASE_URL: postgresql+psycopg://aura_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your deployment environment}@db:5432/aura_study
      AURA_ALLOWED_HOSTS: ${AURA_ALLOWED_HOSTS:?Set AURA_ALLOWED_HOSTS to your public host name}
      TRUSTED_PROXY_COUNT: "1"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - aura_uploads:/app/backend/uploads
      - aura_backups:/app/backend/backups
      - aura_logs:/app/backend/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; host=os.getenv('AURA_ALLOWED_HOSTS','').split(',')[0].strip(); req=urllib.request.Request('http://127.0.0.1:5000/api/health',headers={'Host':host}); urllib.request.urlopen(req,timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aura_study
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your deployment environment}
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_study"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aura_postgres_data:
  aura_uploads:
  aura_backups:
  aura_logs:
