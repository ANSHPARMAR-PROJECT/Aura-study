services:
  postgres:
    image: postgres:16-alpine
    container_name: aura-study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aura_study
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5432:5432"
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data

volumes:
  aura_postgres_data:
